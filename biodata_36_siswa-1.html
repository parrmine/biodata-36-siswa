<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biodata 36 Siswa</title><style>body{font-family:Arial,sans-serif;background:#f3f5f9;color:#172033;margin:0;padding:20px}main{max-width:1050px;margin:auto}h1{text-align:center}p{text-align:center;color:#526079}.toolbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px}button{background:#244c9b;color:white;border:0;border-radius:8px;padding:11px 16px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:15px}.card{background:white;border-radius:12px;padding:17px;box-shadow:0 2px 10px #0001}.photo{width:110px;height:140px;object-fit:cover;background:#e9edf4;border:2px dashed #9daac0;border-radius:6px;display:block;margin:10px auto}.card h2{font-size:18px;margin:0}label{display:block;font-size:13px;margin-top:9px;font-weight:bold}input{box-sizing:border-box;width:100%;padding:9px;border:1px solid #cad2df;border-radius:6px;margin-top:4px}input[type=file]{font-size:12px}small{display:block;text-align:center;color:#68768c}@media print{.toolbar,input[type=file],.hint{display:none}body{background:white}.card{break-inside:avoid;border:1px solid #ccc;box-shadow:none}}</style></head><body><main><h1>BIODATA 36 SISWA</h1><p>Isi biodata dan pilih foto pada masing-masing kartu. Data tersimpan di browser perangkat ini.</p><div class="toolbar"><button onclick="exportData()">Unduh Data (JSON)</button><button onclick="document.getElementById('importFile').click()">Buka Data Tersimpan</button><input id="importFile" type="file" accept="application/json" hidden onchange="importData(event)"><button onclick="window.print()">Cetak / Simpan PDF</button></div><p class="hint">Untuk berbagi hasil antarperangkat, kirim file JSON yang diunduh lalu buka melalui tombol “Buka Data Tersimpan”. Foto berukuran besar dapat memenuhi penyimpanan browser.</p><section class="grid" id="cards"></section></main><script>const KEY='biodata36-v1';let data=[];try{data=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}while(data.length<36)data.push({});const fields=[['nama','Nama lengkap','text'],['tempat','Tempat lahir','text'],['tanggal','Tanggal lahir','date'],['alamat','Alamat','text'],['kelas','Kelas','text']];const cards=document.getElementById('cards');function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Penyimpanan browser penuh. Unduh data JSON agar tidak hilang.')}}function render(){cards.innerHTML='';data.slice(0,36).forEach((d,i)=>{let card=document.createElement('article');card.className='card';let h=document.createElement('h2');h.textContent='Siswa '+String(i+1).padStart(2,'0');card.append(h);let img=document.createElement('img');img.className='photo';img.alt='Foto siswa '+(i+1);if(d.foto)img.src=d.foto;card.append(img);let sm=document.createElement('small');sm.textContent='Foto siswa (3 × 4)';card.append(sm);let fl=document.createElement('input');fl.type='file';fl.accept='image/*';fl.setAttribute('aria-label','Unggah foto siswa '+(i+1));fl.onchange=()=>{let f=fl.files[0];if(!f)return;if(f.size>2*1024*1024){alert('Pilih foto maksimal 2 MB');fl.value='';return}let reader=new FileReader();reader.onload=()=>{d.foto=reader.result;img.src=d.foto;save()};reader.readAsDataURL(f)};card.append(fl);fields.forEach(([key,label,type])=>{let l=document.createElement('label');l.textContent=label;let input=document.createElement('input');input.type=type;input.value=d[key]||'';input.oninput=()=>{d[key]=input.value;save()};l.append(input);card.append(l)});cards.append(card)})}function exportData(){let blob=new Blob([JSON.stringify({judul:'Biodata 36 Siswa',siswa:data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='biodata-36-siswa.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);if(!Array.isArray(obj.siswa)||obj.siswa.length!==36)throw Error();data=obj.siswa;save();render()}catch(e){alert('File tidak sesuai format biodata 36 siswa.')}};r.readAsText(f)}render();</script></body></html>
